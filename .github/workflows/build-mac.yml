name: Build Bruno Unlimited Mac

on:
  schedule:
    # Tự động kiểm tra và sync mỗi ngày lúc 00:00 UTC (07:00 sáng giờ VN)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Bắt buộc build kể cả khi không có commit mới'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  check-sync-and-build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync with Upstream (usebruno/bruno)
        id: sync
        run: |
          git remote add upstream https://github.com/usebruno/bruno.git 2>/dev/null || true
          git fetch upstream main

          UPSTREAM_HASH=$(git rev-parse upstream/main)
          MERGE_BASE=$(git merge-base HEAD upstream/main)

          if [ "$UPSTREAM_HASH" = "$MERGE_BASE" ]; then
            echo "Already up to date with upstream."
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "New commits detected in upstream. Merging..."
            git merge upstream/main -m "chore: sync with upstream usebruno/bruno" --no-edit
            git push origin main
            echo "has_updates=true" >> $GITHUB_OUTPUT
          fi

      - name: Determine if build is needed
        id: check_build
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_build=true" >> $GITHUB_OUTPUT
          elif [ "${{ steps.sync.outputs.has_updates }}" = "true" ]; then
            echo "run_build=true" >> $GITHUB_OUTPUT
          else
            echo "No new updates from upstream. Skipping build."
            echo "run_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check_build.outputs.run_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup & Build Prerequisite Packages
        if: steps.check_build.outputs.run_build == 'true'
        run: node ./scripts/setup.js

      - name: Build Web App
        if: steps.check_build.outputs.run_build == 'true'
        run: npm run build:web

      - name: Build Desktop App (.dmg)
        if: steps.check_build.outputs.run_build == 'true'
        run: npm run build:electron:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Apple Silicon DMG (M1/M2/M3/M4)
        if: steps.check_build.outputs.run_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Bruno-Mac-AppleSilicon-arm64
          path: packages/bruno-electron/out/*arm64*.dmg

      - name: Upload Intel DMG
        if: steps.check_build.outputs.run_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Bruno-Mac-Intel-x64
          path: packages/bruno-electron/out/*x64*.dmg

      - name: Publish to GitHub Releases
        if: steps.check_build.outputs.run_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-mac
          name: "Bruno Unlimited Mac (Latest Auto-Build)"
          body: |
            Bản cài đặt Bruno Unlimited Workspaces (.dmg) cho macOS:
            - **Chip Apple Silicon (M1/M2/M3/M4):** Tải file `*arm64*.dmg` (~130MB)
            - **Chip Intel:** Tải file `*x64*.dmg` (~135MB)
          files: |
            packages/bruno-electron/out/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}